<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123c35">
<title>Domino Scorekeeper</title>
<style>
:root{--green:#123c35;--green2:#1d5a4d;--cream:#f7f4ec;--ink:#172522;--muted:#718078;--gold:#e7b85c;--red:#b94a42}
*{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{background:var(--green);color:white;padding:25px 20px 28px;text-align:center;border-radius:0 0 26px 26px}
.logo{font-size:12px;letter-spacing:3px;color:#c6d9d1;font-weight:800}.title{font-size:29px;font-weight:850;margin:5px 0}.subtitle{font-size:13px;color:#d5e2dc}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 5px 20px #173a2d0c;margin-bottom:16px}
.label{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text]{min-width:0;flex:1;padding:13px;border:1px solid #dce4df;border-radius:11px;font:inherit}
select,button{font:inherit}
select{padding:12px;border:1px solid #dce4df;border-radius:11px;background:white}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:750;cursor:pointer}
.primary{background:var(--green2);color:white}.secondary{background:#edf2ef;color:var(--green)}.danger{background:#fff0ee;color:var(--red)}
#players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.player{background:white;border-radius:18px;padding:16px;box-shadow:0 5px 20px #173a2d0c;border:2px solid transparent;position:relative;overflow:hidden}
.player.winner{border-color:var(--gold);background:#fffaf0}
.player-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.player-name{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.score{font-size:42px;line-height:1.1;font-weight:850;letter-spacing:-2px;margin:17px 0 4px}
.score small{font-size:13px;color:var(--muted);letter-spacing:0;font-weight:650}
.progress{height:7px;border-radius:8px;background:#edf1ee;overflow:hidden;margin:13px 0}
.progress span{display:block;height:100%;background:var(--green2);border-radius:8px;transition:width .2s}
.winner .progress span{background:var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add{background:var(--green);color:white;font-size:17px;padding:13px 8px}
.undo{background:#edf2ef;color:#43534c;padding:13px 8px}
.add:disabled,.undo:disabled{opacity:.35;cursor:not-allowed}
.badge{font-size:10px;font-weight:900;letter-spacing:.8px;color:#88631f;background:#f7e9c7;padding:5px 8px;border-radius:20px}
#status{text-align:center;font-weight:800;color:var(--green);padding:7px 0 14px;min-height:35px}
#game{display:none} .setup-note{font-size:12px;color:var(--muted);margin-top:9px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:8px}
@media(max-width:420px){#players{gap:9px}.player{padding:13px}.score{font-size:36px}.player-name{font-size:14px}.add,.undo{font-size:15px;padding:12px 5px}}
</style>
</head>
<body>
<header><div class="logo">GAME NIGHT • SCORE TRACKER</div><div class="title">Domino Scorekeeper</div><div class="subtitle">Tap to add points. First player to 150 wins.</div></header>
<main>
<section id="setup" class="panel">
 <div class="label">Start a new game</div>
 <div class="row" style="margin-bottom:12px"><label for="count" style="font-weight:700">Players</label><select id="count"><option value="2">2 players</option><option value="3">3 players</option><option value="4">4 players</option></select></div>
 <div id="nameFields" style="display:grid;grid-template-columns:1fr 1fr;gap:9px"></div>
 <div class="row" style="margin-top:15px"><button class="primary" style="width:100%" id="start">Start game</button></div>
 <div class="setup-note">Each score tap adds 5 points. Undo removes the last 5 points for that player.</div>
</section>
<section id="game">
 <div id="status" aria-live="polite">Game in progress</div>
 <div id="players"></div>
 <div class="panel" style="margin-top:16px">
  <div class="row" style="justify-content:space-between"><div><div class="label" style="margin:0 0 4px">Game target</div><strong>150 points</strong></div><button class="secondary" id="newGame">New game</button></div>
 </div>
</section>
<footer>Scores stay on this device while you play.</footer>
</main>
<script>
const $=id=>document.getElementById(id); let players=[],history=[],finished=false;
function fields(){const n=+$('count').value; $('nameFields').innerHTML='';for(let i=0;i<n;i++){const input=document.createElement('input');input.type='text';input.maxLength=22;input.placeholder=`Player ${i+1} name`;input.value=`Player ${i+1}`;input.id=`name${i}`;$('nameFields').append(input)}}
$('count').addEventListener('change',fields); fields();
$('start').onclick=()=>{const n=+$('count').value;players=Array.from({length:n},(_,i)=>({name:$(`name${i}`).value.trim()||`Player ${i+1}`,score:0}));history=[];finished=false;$('setup').style.display='none';$('game').style.display='block';render()};
function change(i,delta){if(finished)return;if(delta>0){players[i].score=Math.min(150,players[i].score+5);history.push(i)}else{if(players[i].score<5)return;players[i].score-=5;const last=history.lastIndexOf(i);if(last>=0)history.splice(last,1)}
if(players.some(p=>p.score>=150))finished=true;render()}
function undoLast(i){if(finished)return;const last=history.lastIndexOf(i);if(last<0)return;history.splice(last,1);players[i].score=Math.max(0,players[i].score-5);render()}
function render(){
const winner=players.find(p=>p.score>=150);
$('status').textContent=finished?`🏆 ${winner.name} wins! — It won’t hold anymore`:'Tap +5 to update a player’s score';
$('players').innerHTML='';
players.forEach((p,i)=>{const won=p.score>=150;const card=document.createElement('article');card.className='player'+(won?' winner':'');
const snunk=finished&&!won&&p.score<75;
card.innerHTML=`<div class="player-top"><div class="player-name"></div>${won?'<span class="badge">WINNER</span>':(snunk?'<span class="badge">SNUNK</span>':'')}</div>${snunk?'<div style="font-weight:900;color:#b94a42;font-size:13px;margin-top:8px">Snunk</div>':''}<button class="secondary edit-initials" style="margin-top:8px;padding:6px 9px;font-size:11px">Edit initials</button><div class="score">${p.score}<small> / 150</small></div><div class="progress"><span style="width:${p.score/150*100}%"></span></div><div class="actions" style="grid-template-columns:1fr"><button class="add" ${finished?'disabled':''}>+5 points</button><button class="undo" ${finished||p.score<5?'disabled':''}>Undo −5</button></div>`;
card.querySelector('.player-name').textContent=p.name;card.querySelector('.edit-initials').onclick=()=>{const updated=prompt('Update player name or initials:',p.name);if(updated!==null&&updated.trim()){p.name=updated.trim().slice(0,22);render()}};card.querySelector('.add').onclick=()=>change(i,5);card.querySelector('.undo').onclick=()=>undoLast(i);$('players').append(card)});
}
$('newGame').onclick=()=>{if(confirm('Start a new game? Current scores will be cleared.')){$('game').style.display='none';$('setup').style.display='block';fields()}};
</script>
</body></html>
